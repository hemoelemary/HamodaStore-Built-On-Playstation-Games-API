    <script>
        const bg = document.querySelectorAll('.bg-gr')
        bg.forEach(node=>{
            node.addEventListener('mouseenter',(event)=>{
                const target = event.currentTarget
                const textgen = target.querySelector('.text-gen');
                textgen.classList.add('active')

            })
            node.addEventListener('mouseleave',(event)=>{
                const target = event.currentTarget
                const textgen = target.querySelector('.text-gen');
                textgen.classList.remove('active')

            })
        })
        
        const theme = document.querySelector('.theme')
        theme.addEventListener('click',(event)=>{
            if (theme.classList.contains('fa-sun')){
                const body = document.querySelector('body');
                body.classList.add('bg-black');
                const navli = document.querySelectorAll('li');
                navli.forEach((node)=>{
                    node.classList.add('text-white')
                });
                const hs = document.querySelector('#prod');
                hs.classList.add('text-white');
                event.currentTarget.classList.add('fa-moon');
                event.currentTarget.classList.remove('fa-sun');


            }else if(theme.classList.contains('fa-moon')){
                const body = document.querySelector('body');
                body.classList.remove('bg-black');
                const navli = document.querySelectorAll('li');
                navli.forEach((node)=>{
                    node.classList.remove('text-white')
                });
                const hs = document.querySelector('#prod');
                hs.classList.remove('text-white');
                event.currentTarget.classList.remove('fa-moon');
                event.currentTarget.classList.add('fa-sun');

            }
        })

                const contx = document.querySelector('.contx');

                        <div class='card-btn'></div>
                        </div>
                        </div>
                </div>
                    `

                    const btn =event.currentTarget.querySelector('.card-btn');
                    btn.classList.remove('btn','btn-warning','rounded-pill','px-4','py-2')
                    btn.innerHTML='';
                })
                
            })

                })
